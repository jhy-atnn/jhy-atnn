<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Preview of Jhody Atinon's portfolio</title>
  <desc id="description">A clean portfolio landing page preview for a database administrator and web developer.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6B00"/>
      <stop offset=".5" stop-color="#FF3E8E"/>
      <stop offset="1" stop-color="#8B2CF5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F8D8FF" stop-opacity=".9"/>
      <stop offset="1" stop-color="#F8D8FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#25113D" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="28" fill="#FCFCFD"/>
  <rect x="1" y="1" width="1198" height="628" rx="27" fill="none" stroke="#E9E9EE" stroke-width="2"/>
  <circle cx="874" cy="353" r="260" fill="url(#glow)"/>

  <g transform="translate(76 58)">
    <path d="M0 0 18 15 34 0 20 31 46 31 13 70 24 39 0 39 12 18Z" fill="url(#accent)"/>
    <text x="58" y="37" fill="#28212D" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="700">jhy_atnn</text>
  </g>

  <g fill="#3A3440" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600">
    <text x="775" y="86" fill="#FF5B36">Home</text>
    <text x="846" y="86">About</text>
    <text x="916" y="86">Projects</text>
    <text x="1017" y="86">Contact</text>
  </g>
  <rect x="772" y="100" width="48" height="3" rx="1.5" fill="url(#accent)"/>

  <g transform="translate(130 212)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect width="177" height="35" rx="17.5" fill="#FFF2E9" stroke="#FFD1B6"/>
    <text x="23" y="23.5" fill="#FF6925" font-size="14" font-weight="700" letter-spacing="1.1">HELLO, I'M JHODY</text>
    <text x="0" y="121" fill="url(#accent)" font-size="62" font-weight="800">Database</text>
    <text x="0" y="202" fill="#211E24" font-size="62" font-weight="800">Administrator &amp;</text>
    <text x="0" y="283" fill="#211E24" font-size="62" font-weight="800">Web Developer</text>
    <text x="0" y="339" fill="#77727B" font-size="20">A focused collection of selected work, skills, and experience.</text>
    <rect x="0" y="379" width="175" height="52" rx="26" fill="url(#accent)"/>
    <text x="33" y="412" fill="#FFFFFF" font-size="17" font-weight="700">View portfolio</text>
  </g>

  <g transform="translate(847 160)" filter="url(#shadow)">
    <circle cx="151" cy="151" r="145" fill="#FFFFFF"/>
    <circle cx="151" cy="151" r="150" fill="none" stroke="url(#accent)" stroke-width="6"/>
    <circle cx="151" cy="151" r="111" fill="#FAF7FF"/>
    <path d="M102 105 148 145 190 105 165 183 210 183 133 242 151 196 91 196Z" fill="url(#accent)"/>
    <text x="151" y="289" text-anchor="middle" fill="#6D6476" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" letter-spacing="1.8">JHODY ATINON</text>
  </g>
</svg>
