name: Update contribution streak

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/streak-stats.yml"

permissions:
  contents: write

jobs:
  build:
    name: Generate streak card
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=default&border_radius=16&ring=8B5CF6&fire=EC4899&currStreakNum=111827&sideNums=111827&currStreakLabel=8B5CF6&sideLabels=4B5563&dates=6B7280&disable_animations=true&timezone=Asia/Manila
          path: profile/streak.svg
          # This is a repository secret, not a literal token.
          token: ${{ secrets.PROFILE_SUMMARY_CARDS_TOKEN }}
      - name: Commit updated streak card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update contribution streak"
          git push
